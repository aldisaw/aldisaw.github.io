<style>
/* --- CSS KUSTOM UNTUK FOOTER MODERN --- */
.site-footer {
  border-top: 1px solid rgba(0, 0, 0, 0.08);
  padding: 40px 20px;
  margin-top: 60px;
  text-align: center;
  font-size: 0.9rem;
  color: #6c757d;
}

.footer-content {
  max-width: 800px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 16px;
}

.footer-info p {
  margin: 4px 0;
}

.footer-subtitle {
  font-size: 0.8rem;
  opacity: 0.8;
}

.footer-social {
  display: flex;
  gap: 20px;
  margin-top: 8px;
}

.footer-social a {
  color: #555;
  background: rgba(0, 0, 0, 0.04);
  width: 40px;
  height: 40px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.3s ease;
}

.footer-social a:hover {
  background: #3498db;
  color: #ffffff;
  transform: translateY(-3px);
  box-shadow: 0 4px 10px rgba(52, 152, 219, 0.3);
}

/* Penyesuaian untuk Dark Mode bawaan tema */
@media (prefers-color-scheme: dark) {
  .site-footer {
    border-top-color: rgba(255, 255, 255, 0.1);
    color: #a0a0a0;
  }
  .footer-social a {
    color: #ccc;
    background: rgba(255, 255, 255, 0.08);
  }
  .footer-social a:hover {
    background: #3498db;
    color: #fff;
  }
}
</style>
