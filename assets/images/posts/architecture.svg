<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 680" width="1120" height="680" font-family="Inter, Segoe UI, system-ui, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10b981"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f59e0b"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1120" height="680" rx="14" fill="#0d1117"/>
  <rect x="16" y="16" width="1088" height="648" rx="10" fill="none" stroke="#30363d" stroke-width="1.5"/>

  <!-- Header -->
  <text x="40" y="54" fill="#f0f6fc" font-size="22" font-weight="700">Multi-Instance Android Research &amp; Automation Architecture</text>
  <text x="40" y="76" fill="#8b949e" font-size="13">Sanitized Reference Architecture • Windows Host • 7 Android Emulators • 7 mitmdump Proxies • 1 CLICK Controller</text>

  <!-- Launcher Box -->
  <rect x="40" y="102" width="240" height="84" rx="8" fill="#161b22" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="58" y="130" fill="#38bdf8" font-size="14" font-weight="700">Launcher (run.py)</text>
  <text x="58" y="150" fill="#c9d1d9" font-size="11.5">• Spawns 7x mitmdump CMD</text>
  <text x="58" y="168" fill="#c9d1d9" font-size="11.5">• Arranges via pygetwindow</text>

  <!-- CLICK Controller Box -->
  <rect x="330" y="102" width="440" height="122" rx="8" fill="#161b22" stroke="#10b981" stroke-width="2"/>
  <text x="350" y="130" fill="#10b981" font-size="15" font-weight="700">CLICK Main Controller (click.py)</text>
  <text x="350" y="152" fill="#c9d1d9" font-size="11.5">• 7x Emulator Worker Threads (process_emulator via ADB)</text>
  <text x="350" y="170" fill="#c9d1d9" font-size="11.5">• 1x Live Progress Table Updater (1s refresh) + 1x Pause Listener (ENTER)</text>
  <text x="350" y="188" fill="#c9d1d9" font-size="11.5">• Shared Work-Stealing Queue (id.txt) guarded by threading.Lock</text>
  <text x="350" y="206" fill="#c9d1d9" font-size="11.5">• Implicit IPC via os.path.getmtime() polling + merge_results()</text>

  <!-- VPN Box -->
  <rect x="830" y="102" width="250" height="84" rx="8" fill="#161b22" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="848" y="130" fill="#f59e0b" font-size="14" font-weight="700">VPN CLI Manager</text>
  <text x="848" y="150" fill="#c9d1d9" font-size="11.5">• Pre-flight status / connect</text>
  <text x="848" y="168" fill="#c9d1d9" font-size="11.5">• Auto-rotate every 200 IDs</text>

  <!-- Arrows Top Layer -->
  <line x1="280" y1="144" x2="326" y2="144" stroke="#38bdf8" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="770" y1="144" x2="826" y2="144" stroke="#f59e0b" stroke-width="1.8" marker-end="url(#arrow-amber)"/>
  <line x1="826" y1="156" x2="774" y2="156" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow-amber)"/>

  <!-- Emulators Band -->
  <rect x="40" y="266" width="1040" height="114" rx="10" fill="#11161d" stroke="#30363d" stroke-width="1.2"/>
  <text x="58" y="290" fill="#f0f6fc" font-size="13" font-weight="700">7 Android Emulator Instances (ADB Serials — Pre-Booted Research Environment)</text>

  <g fill="#161b22" stroke="#38bdf8" stroke-width="1.2">
    <rect x="58" y="306" width="132" height="58" rx="6"/>
    <rect x="202" y="306" width="132" height="58" rx="6"/>
    <rect x="346" y="306" width="132" height="58" rx="6"/>
    <rect x="490" y="306" width="132" height="58" rx="6"/>
    <rect x="634" y="306" width="132" height="58" rx="6"/>
    <rect x="778" y="306" width="132" height="58" rx="6"/>
    <rect x="922" y="306" width="132" height="58" rx="6"/>
  </g>
  <g fill="#e6edf3" font-size="12" font-weight="600" text-anchor="middle">
    <text x="124" y="330">emulator-5556</text>
    <text x="268" y="330">emulator-5558</text>
    <text x="412" y="330">emulator-5560</text>
    <text x="556" y="330">emulator-5562</text>
    <text x="700" y="330">emulator-5564</text>
    <text x="844" y="330">emulator-5566</text>
    <text x="988" y="330">emulator-5568</text>
  </g>
  <g fill="#8b949e" font-size="10.5" text-anchor="middle">
    <text x="124" y="350">Proxy → :8081</text>
    <text x="268" y="350">Proxy → :8082</text>
    <text x="412" y="350">Proxy → :8083</text>
    <text x="556" y="350">Proxy → :8084</text>
    <text x="700" y="350">Proxy → :8085</text>
    <text x="844" y="350">Proxy → :8086</text>
    <text x="988" y="350">Proxy → :8087</text>
  </g>

  <!-- Arrow CLICK -> Emulators -->
  <line x1="550" y1="224" x2="550" y2="262" stroke="#10b981" stroke-width="2" marker-end="url(#arrow-green)"/>
  <text x="562" y="249" fill="#10b981" font-size="11" font-weight="600">ADB shell input (7 worker threads)</text>

  <!-- MITM Band -->
  <rect x="40" y="422" width="1040" height="114" rx="10" fill="#11161d" stroke="#30363d" stroke-width="1.2"/>
  <text x="58" y="446" fill="#f0f6fc" font-size="13" font-weight="700">7 Dedicated mitmdump Processes (INSTANCE_ID Env Isolation • -q -s mitm.py -p 8081..8087)</text>

  <g fill="#161b22" stroke="#a855f7" stroke-width="1.2">
    <rect x="58" y="462" width="132" height="58" rx="6"/>
    <rect x="202" y="462" width="132" height="58" rx="6"/>
    <rect x="346" y="462" width="132" height="58" rx="6"/>
    <rect x="490" y="462" width="132" height="58" rx="6"/>
    <rect x="634" y="462" width="132" height="58" rx="6"/>
    <rect x="778" y="462" width="132" height="58" rx="6"/>
    <rect x="922" y="462" width="132" height="58" rx="6"/>
  </g>
  <g fill="#e9d5ff" font-size="12" font-weight="600" text-anchor="middle">
    <text x="124" y="486">MITM DUMP 01</text>
    <text x="268" y="486">MITM DUMP 02</text>
    <text x="412" y="486">MITM DUMP 03</text>
    <text x="556" y="486">MITM DUMP 04</text>
    <text x="700" y="486">MITM DUMP 05</text>
    <text x="844" y="486">MITM DUMP 06</text>
    <text x="988" y="486">MITM DUMP 07</text>
  </g>
  <g fill="#8b949e" font-size="10.5" text-anchor="middle">
    <text x="124" y="506">:8081 • 5 threads</text>
    <text x="268" y="506">:8082 • 5 threads</text>
    <text x="412" y="506">:8083 • 5 threads</text>
    <text x="556" y="506">:8084 • 5 threads</text>
    <text x="700" y="506">:8085 • 5 threads</text>
    <text x="844" y="506">:8086 • 5 threads</text>
    <text x="988" y="506">:8087 • 5 threads</text>
  </g>

  <!-- 1:1 Emulator to MITM arrows -->
  <g stroke="#38bdf8" stroke-width="1.5" marker-end="url(#arrow)">
    <line x1="124" y1="364" x2="124" y2="458"/>
    <line x1="268" y1="364" x2="268" y2="458"/>
    <line x1="412" y1="364" x2="412" y2="458"/>
    <line x1="556" y1="364" x2="556" y2="458"/>
    <line x1="700" y1="364" x2="700" y2="458"/>
    <line x1="844" y1="364" x2="844" y2="458"/>
    <line x1="988" y1="364" x2="988" y2="458"/>
  </g>

  <!-- Shared Filesystem & Aggregation Band -->
  <rect x="40" y="572" width="510" height="70" rx="8" fill="#161b22" stroke="#10b981" stroke-width="1.5"/>
  <text x="58" y="598" fill="#10b981" font-size="13" font-weight="700">Per-Instance Result Logs (Implicit IPC via mtime)</text>
  <text x="58" y="618" fill="#c9d1d9" font-size="11.5">berhasil_emulator-55XX.txt  •  gagal_emulator-55XX.txt  (append-only)</text>

  <rect x="590" y="572" width="490" height="70" rx="8" fill="#161b22" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="608" y="598" fill="#38bdf8" font-size="13" font-weight="700">Final Consolidated Output (merge_results)</text>
  <text x="608" y="618" fill="#c9d1d9" font-size="11.5">berhasil_all.txt  •  gagal_all.txt  (generated after all 7 workers join)</text>

  <line x1="295" y1="536" x2="295" y2="568" stroke="#10b981" stroke-width="1.8" marker-end="url(#arrow-green)"/>
  <line x1="550" y1="607" x2="586" y2="607" stroke="#38bdf8" stroke-width="1.8" marker-end="url(#arrow)"/>
</svg>
