# Site settings
title: "Aldisaw — Aldi Saputra Wahyudi"
tagline: "Security Researcher & Digital Creator."
email: hello@aldisaw.id
author: Aldi Saputra Wahyudi
brand: ALDISAW
copyright: "&copy; {currentYear} {author} (ALDISAW)"

description: >-
  Aldi Saputra Wahyudi (Aldisaw) — Cybersecurity professional and security researcher sharing vulnerability research, technical write-ups, digital content, and personal stories.

keywords: >-
  Aldi Saputra Wahyudi, Aldisaw, Cybersecurity, Application Security, Penetration Testing, Vulnerability Assessment, Bug Bounty, Vulnerability Research, Android Security, Mobile Application Security, Digital Creator

url: "https://aldisaw.id"
baseurl: ""
favicon: "/assets/favicon.ico"
lang: "en"
future: true

# Social & Author Metadata (used by jekyll-seo-tag and JSON-LD)
social:
  name: Aldi Saputra Wahyudi
  links:
    - https://github.com/aldisaw
    - https://www.linkedin.com/in/aldisaw
    - https://instagram.com/aldisaw

# Date format
yat:
  date_format: "%b %d, %Y"

# Theme & Night mode ("manual" persists user choice in localStorage, defaults to light)
night_mode: "manual"
content_width: "1080px"

# Google Analytics (GA4) - uncomment and add Measurement ID when ready
# google_analytics:
# enableDNT: "true"

# Build settings
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter: rouge

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-paginate

# Exclude non-site files from build output
exclude:
  - Gemfile
  - Gemfile.lock
  - jekyll-theme-yat.gemspec
  - README.md
  - LICENSE.txt
  - vendor/
  - .github/

# Default front matter
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      author: "Aldi Saputra Wahyudi"
  - scope:
      path: "portfolio"
    values:
      sitemap: false
